version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: veda_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veda_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-veda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veda_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veda_user} -d ${POSTGRES_DB:-veda_ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - veda_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veda_fastapi_backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-"Veda AI Backend API"}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-veda_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-veda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veda_password}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veda_user}:${POSTGRES_PASSWORD:-veda_password}@db:5432/${POSTGRES_DB:-veda_ai_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173"]'}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - veda_network

volumes:
  postgres_data:
    driver: local

networks:
  veda_network:
    driver: bridge

